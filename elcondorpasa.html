t", "Mayan Style", "Stamina / Speed Heal"], "badge": "Versi 2 dari 4"}, {"id": 3, "title": "Tracen Academy Uniform", "jpTitle": "[Tracen Academy] School Uniform", "type": "School Uniform", "rarity": "Standard Outfit", "img": "https://umamusu.wiki/w/images/c/c0/Game_Asset_chara_stand_1014_000005.png", "description": "Seragam musim panas / musim dingin resmi Akademi Tracen. Desain blazer ungu dengan pita dasi emas yang dipakai El sehari-hari saat belajar di kelas bersama Grass Wonder.", "tags": ["Campus Life", "Miho Dormitory", "Student"], "badge": "Versi 3 dari 4"}, {"id": 4, "title": "Casual / Private Outfit", "jpTitle": "[Casual Wear] Private Outfit", "type": "Casual Wear", "rarity": "Event / Private", "img": "https://umamusu.wiki/w/images/4/48/Game_Asset_chara_stand_1014_901014.png", "description": "Pakaian santai kasual bernuansa gaya Latin modern dengan jaket dan syal merah hangat yang dikenakan El saat jalan-jalan membeli saus salsa pedas.", "tags": ["Private Outfit", "Spicy Food Hunt", "Casual"], "badge": "Versi 4 dari 4"}], "specTitle": "Spesifikasi Karakter", "stats": [["Nama Jepang", "エルコンドルパサー"], ["Asal Tempat", "Amerika Serikat (Import)"], ["Tinggi / Berat", "163 cm / Sempurna"], ["Ukuran B-W-H", "89 - 58 - 86"], ["Kamar Asrama", "Asrama Miho (Kamar 208)"], ["Teman Kamar", "Grass Wonder"]], "bioTitle": "Biografi Kepribadian", "bio": ["El Condor Pasa lahir di Amerika Serikat dan dibesarkan dengan mengagumi seni pertunjukan <i>Lucha Libre</i>. Kepribadiannya sangat ramah, penuh semangat (<i>hyperactive</i>), serta mudah akrab dengan siapa saja. Ia menganggap semua tantangan sebagai panggung pertunjukan besar di mana dirinya harus tampil sebagai pemenang nomor satu!", "Kemampuannya beradaptasi sangat luar biasa; ia tidak hanya kuat di lintasan Rumput (Turf), tetapi juga sangat hebat di lintasan Tanah/Lumpur (Dirt). Keberaniannya pergi bertanding ke Eropa hingga meraih posisi runner-up di <b>Prix de l'Arc de Triomphe</b> menjadikannya salah satu legenda terbesar Golden Generation."], "aptTitle": "Kemampuan Balap (Aptitude)", "apt": [["Rumput (Turf)", "A"], ["Tanah (Dirt)", "A"], ["Jarak Mile & Menengah", "A"], ["Taktik Pace Chaser", "A"]], "appTitle": "Ciri Visual & Desain Karakter", "features": [{"t": "Topeng Lucha Libre (Mask)", "d": "Topeng bermotif bulu burung kondor yang menutupi sekitar mata, menjadi lambang keberanian pegulat dan identitas utamanya.", "i": "fa-solid fa-mask"}, {"t": "Motif Sayap Kondor", "d": "Seragam balapnya dilengkapi ornamen rumbai-rumbai dan motif sayap di bagian bahu dan pinggang yang mengepak saat berlari.", "i": "fa-solid fa-feather"}, {"t": "Sabuk Emas Juara", "d": "Aksesoris sabuk besar bertuliskan lambang bintang yang terinspirasi dari sabuk kejuaraan dunia Lucha Libre.", "i": "fa-solid fa-trophy"}, {"t": "Botol Saus Pedas", "d": "Sering digambarkan membawa botol saus tabasco / salsa ekstra pedas yang selalu ditambahkan ke dalam makanan sehari-harinya.", "i": "fa-solid fa-pepper-hot"}], "irlTitle": "Sejarah Kuda Pacu Asli (El Condor Pasa 1995-2002)", "irl": "El Condor Pasa (lahir 17 Maret 1995 di Kentucky, AS) adalah kuda pacu jantan murni (<b>thoroughbred</b>) luar biasa yang dilatih di Jepang. Dikenal karena dominasinya di turnamen <b>NHK Mile Cup (1998)</b> dan <b>Japan Cup (1998)</b>, serta prestasinya yang mengguncang dunia saat meraih posisi ke-2 di balapan paling prestisius di Perancis, <b>Prix de l'Arc de Triomphe (1999)</b>.", "irlStats": [["Total Rekor Balap", "11 Laga / 6 Kemenangan"], ["Penghargaan Legendaris", "JRA Horse of the Year (1999)"], ["Prestasi Internasional", "Prix de l'Arc 2nd"]], "tabs": ["Biografi & Statistik", "Penampilan & Desain", "Kuda Pacu Nyata (IRL)"], "varTitle": "Galeri Variasi Karakter (4 Versi)", "varSub": "Gunakan tombol navigasi untuk melihat 4 iterasi kostum El Condor Pasa yang tersedia dalam waralaba.", "wikiTitle": "Profil & Detail Wiki", "relTitle": "Hubungan Karakter (Relationships)", "rels": [{"label": "Teman Kamar & Sahabat", "name": "Grass Wonder", "desc": "Rekan satu kamar di Asrama Miho (Kamar 208). Meskipun memiliki kontras kepribadian (El hiperaktif &amp; Grass lembut), keduanya sangat dekat dan saling mendukung.", "rel": "Hubungan: Roommate & Mutual Trust", "links": [["Grass Page →", "grasswonder.html"]]}, {"label": "Sahabat & Rival Derby", "name": "Special Week", "desc": "Sahabat heboh sekaligus rival balap seangkatan. Sering berlomba makan bersama dan saling memotivasi untuk menjadi yang terbaik.", "rel": "Hubungan: Friendly Rivals", "links": [["Spe Page →", "specialweek.html"]]}, {"label": "Sahabat Angkatan", "name": "Seiun Sky", "desc": "Teman bercanda di sekolah. El sering kali gemas melihat ketenangan dan gaya santai Seiun Sky saat menghadapi balapan penting.", "rel": "Hubungan: Generasi Emas", "links": [["Seiun Page →", "seiunsky.html"]]}, {"label": "Rekan Seperjuangan", "name": "King Halo", "desc": "El sering menggoda harga diri tinggi King Halo, tetapi di dalam hati sangat menghormati semangat baja sang putri terpandang tersebut.", "rel": "Hubungan: Generasi Emas", "links": [["King Page →", "kinghalo.html"]]}], "media": [{"label": "Anime Adaptasi", "badge": "Season 1 Key Character", "text": "Di Anime <b>Season 1</b>, El Condor Pasa menjadi salah satu karakter paling mencolok yang memilih bertanding di panggung Eropa untuk menghadapi Montjeu di Prix de l'Arc de Triomphe.", "icon": "fa-solid fa-film"}, {"label": "Manga", "badge": "Umayon & Spin-off", "text": "Sering tampil penuh aksi komedi dalam manga spin-off <b>Umayon</b> saat mempraktikkan jurus-jurus kejuaraan wrestling Lucha Libre.", "icon": "fa-solid fa-book-open"}, {"label": "Lagu Karakter", "badge": "WINNING LIVE", "text": "Menyanyikan lagu solo khas bernuansa latin-pop energik: <span class=\"text-amber-400 italic\">\"Plan de El Condor\"</span> serta lagu tema utama <b>Make debut!</b> dan <b>GIRLS' LEGEND U</b>.", "icon": "fa-solid fa-music"}], "mediaTitle": "Penampilan Media", "triviaTitle": "Fakta Menarik (Trivia)", "trivia": [{"q": "1. Rahasia Dibalik Topeng Lucha Libre", "a": "Topeng Lucha Libre yang digunakannya terinspirasi dari budaya gulat profesional Meksiko. El percaya topeng tersebut memberinya dorongan rasa percaya diri ekstra saat berlari di hadapan ribuan penonton."}, {"q": "2. Kecintaan Pada Kuliner Pedas (Spicy Lover)", "a": "El Condor Pasa sangat menyukai makanan pedas seperti taco dengan saus habanero ekstra super pedas. Rekan kamarnya, Grass Wonder, sering membuatkannya camilan manis untuk menetralkan rasa pedasnya."}, {"q": "3. Prestasi Sejarah di Prix de l'Arc de Triomphe", "a": "Kuda pacu aslinya menorehkan sejarah bagi Jepang dengan menjadi runner-up di balapan kuda paling bergengsi sejagat raya, <b>Prix de l'Arc de Triomphe 1999</b> di Longchamp, Perancis, dikalahkan tipis oleh kuda legendaris Eropa Montjeu."}], "footer": ["El Condor Pasa Fan Portal • Uma Musume: Pretty Derby", "El Condor Pasa Fan Portal", "Uma Musume: Pretty Derby", "Data dan informasi dirangkum dari Uma Musume Official Wiki. Karakter El Condor Pasa merupakan hak cipta dari Cygames, Inc.", "@Finwahyu - Golden Generation Portal"], "theme": {"p": "#ef4444", "s": "#f59e0b", "fx": "ember", "rgb": "251,146,60", "icon": "fa-fire"}, "deco": {"st": ["🎭", "🔥", "🌮", "🌶️", "🥊", "⚡", "🌟"], "leaf": ["🔥", "🌶️", "✨"], "day": "¡Buenos días, amigo! Matahari terik, taco panas, topeng siap dipakai. Ayo bertanding!", "night": "Panggung lucha malam hari! Lampu sorot menyala dan penonton bersorak. ¡Es la hora del show!", "pat": "repeating-linear-gradient(45deg,#ef444418 0 10px,#f59e0b18 10px 20px)"}};</script>
