<script>window.D={"file": "specialweek.html", "jpBg": "スペシャルウィーク", "motto": "「日本一のウマ娘になる！」", "name": "Special Week", "tagline": "Japan's Hope • Golden Generation", "intro": "Special Week adalah gadis kuda (<b>Uma Musume</b>) polos dan bersemangat tinggi asal Hokkaido. Memiliki latar belakang unik karena dibesarkan oleh dua ibu (ibu kuda kandung dan ibu manusia angkat), ia pindah ke Akademi Tracen dengan janji membara untuk menjadi <b>Gadis Kuda Nomor Satu di Jepang (日本一のウマ娘)</b>.", "quoteSrc": "— Intro Siswa (Student Introduction)", "quote": "Saya berjanji pada dua ibu saya bahwa saya akan menjadi gadis kuda nomor satu di seluruh Jepang! Mohon bimbingannya, Trainer-san!", "badges": [["Ulang Tahun", "2 Mei"], ["Tinggi Badan", "158 cm"], ["VA / Pengisi Suara", "Waki Azumi"], ["Favorit", "Wortel & Makan Banyak"]], "heroImg": "https://umamusu.wiki/w/images/d/dd/Special_Week_%28Race%29.png", "attire": ["Main Race Attire", "Special Dreamer (スペシャルドリーマー)", "Grade I"], "outfits": [{"id": 1, "title": "Special Dreamer", "jpTitle": "[スペシャルドリーマー] Special Week", "type": "Racing Outfit (Main)", "rarity": "3★ Base Character", "img": "https://umamusu.wiki/w/images/6/63/Game_Asset_chara_stand_1001_100101.png", "description": "Seragam balap resmi bernuansa kombinasi warna putih, magenta, dan ungu dengan dasi kupu-kupu emas. Melambangkan semangat pantang menyerah sang bintang harapan Jepang.", "tags": ["Turf Specialist", "Medium/Long Distance", "Pace Chaser / Betweener"], "badge": "Versi 1 dari 4"}, {"id": 2, "title": "Ruler of Japan", "jpTitle": "[日之本一の総大将] Special Week", "type": "Main Story Outfit (Act 1 Reward)", "rarity": "3★ Special Story Trainee", "img": "https://umamusu.wiki/w/images/2/29/Game_Asset_chara_stand_1001_100102.png", "description": "Kostum zirah jenderal perang bertema 'Ruler of Japan' (Panglima Utama Nomor Satu di Jepang). Kostum spesial ini diperoleh dari penyelesaian Cerita Utama (Main Story Act 1 Finale Part 2), melambangkan tekad terkuat Special Week saat membawa impian seluruh pendukungnya.", "tags": ["Main Story Act 1 Reward", "Japan Cup Champion", "Best in Japan Skill", "Long / Medium Specialist"], "badge": "Versi 2 dari 4"}, {"id": 3, "title": "Tracen Academy Uniform", "jpTitle": "[Tracen Academy] School Uniform", "type": "School Uniform", "rarity": "Standard Outfit", "img": "https://umamusu.wiki/w/images/d/d1/Game_Asset_chara_stand_1001_000005.png", "description": "Seragam musim panas / musim dingin resmi Akademi Tracen. Desain blazer ungu dan rok lipat yang digunakan Special Week saat belajar di kelas bersama teman seangkatannya.", "tags": ["Campus Life", "Miho Dormitory", "Student"], "badge": "Versi 3 dari 4"}, {"id": 4, "title": "Casual / Private Outfit", "jpTitle": "[Casual Wear] Private Outfit", "type": "Casual Wear", "rarity": "Event / Private", "img": "https://umamusu.wiki/w/images/b/b8/Game_Asset_chara_stand_1001_901001.png", "description": "Pakaian santai sehari-hari bertema kasual manis yang dikenakan Special Week saat pergi berbelanja makanan lezat bersama Silence Suzuka di kota.", "tags": ["Private Outfit", "Gourmet Shopping", "Casual"], "badge": "Versi 4 dari 4"}], "specTitle": "Spesifikasi Karakter", "stats": [["Nama Jepang", "スペシャルウィーク"], ["Asal Tempat", "Hokkaido, Jepang"], ["Tinggi / Berat", "158 cm / Sedang bertambah"], ["Ukuran B-W-H", "79 - 57 - 81"], ["Kamar Asrama", "Asrama Miho (Kamar 201)"], ["Teman Kamar", "Silence Suzuka"]], "bioTitle": "Biografi Kepribadian", "bio": ["Special Week tumbuh besar di padang rumput Hokkaido yang asri. Karena ibu kandungnya meninggal saat melahirkannya, ia dibesarkan oleh wanita penangkar yang ia panggil sebagai ibu manusianya. Pengalaman ini membuatnya memiliki tekad ganda untuk membanggakan kedua ibunya.", "Ia memiliki kepribadian yang ceria, polos, dan terkadang sedikit canggung saat berada di kota besar. Namun saat menginjakkan kaki di atas lintasan balap, daya pacu dan dorongan sprint kecepatannya mampu membalikkan keadaan dalam sekejap (<i>Shooting Star</i>)."], "aptTitle": "Kemampuan Balap (Aptitude)", "apt": [["Rumput (Turf)", "A"], ["Jarak Menengah", "A"], ["Jarak Jauh", "A"], ["Taktik Pace Chaser", "A"]], "appTitle": "Ciri Visual & Desain Karakter", "features": [{"t": "Garis Hair Blaze di Dahi", "d": "Jambul rambut putih berujung bintang di bagian dahi depan yang merepresentasikan corak garis bulu putih kuda pacu aslinya.", "i": "fa-solid fa-star"}, {"t": "Aksesoris Telinga Kiri", "d": "Pita pita kombinasi ungu-merah di telinga kiri yang menandakan atribut karakter bertipe betina (filly) dalam waralaba.", "i": "fa-solid fa-ribbon"}, {"t": "Kombinasi Warna Seragam", "d": "Dominasi warna ungu royal, putih bersih, dan aksen merah magenta yang melambangkan keberanian dan kehangatan hati.", "i": "fa-solid fa-vest"}, {"t": "Porsi Makan Gunung", "d": "Visual karakternya sering kali digambarkan memegang mangkuk nasi porsi ekstra tinggi (<i>Oomori</i>) di kantin sekolah.", "i": "fa-solid fa-utensils"}], "irlTitle": "Sejarah Kuda Pacu Asli (Special Week 1995-2018)", "irl": "Special Week (lahir 2 Mei 1995 di Hidaka, Hokkaido) adalah jantan murni (<i>thoroughbred</i>) yang menjadi kebanggaan balap Jepang era 90-an. Di bawah arahan joki legendaris Yutaka Take, ia berhasil menjuarai <b>Tokyo Yushun / Japan Derby (1998)</b>, <b>Tenno Sho Spring &amp; Fall (1999)</b>, serta <b>Japan Cup (1999)</b>.", "irlStats": [["Total Rekor Balap", "17 Laga / 10 Kemenangan"], ["Rival Utama", "Grass Wonder"], ["Gelar Utama", "Japan's Supreme Horse"]], "tabs": ["Biografi & Statistik", "Penampilan & Desain", "Kuda Pacu Nyata (IRL)"], "varTitle": "Galeri Variasi Karakter (4 Versi)", "varSub": "Gunakan tombol navigasi untuk melihat 4 iterasi kostum Special Week yang tersedia dalam waralaba.", "wikiTitle": "Profil & Detail Wiki", "relTitle": "Hubungan Karakter (Relationships)", "rels": [{"label": "Senior & Roommate", "name": "Silence Suzuka", "desc": "Senior yang paling dikagumi dan teman satu kamar di Asrama Miho. Kecepatan berlari Suzuka menjadi sumber inspirasi terbesar bagi Special Week.", "rel": "Hubungan: Kagum & Teman Kamar", "links": []}, {"label": "Rival Abadi", "name": "Grass Wonder", "desc": "Rival terbesar seangkatan. Pertarungan mereka di Takarazuka Kinen &amp; Arima Kinen 1999 menjadi duel paling dramatis dalam sejarah Golden Generation.", "rel": "Hubungan: Dualitas Persaingan", "links": [["Grass Page →", "grasswonder.html"]]}, {"label": "Rival Internasional", "name": "El Condor Pasa", "desc": "Sahabat heboh dan rival balap sejak kelas awal. Sering saling menantang dalam hal kemampuan bertanding maupun makan bersama.", "rel": "Hubungan: Sahabat & Rival", "links": [["El Condor Page →", "elcondorpasa.html"]]}, {"label": "Kawan Angkatan", "name": "Seiun & King Halo", "desc": "Rekan seperjuangan dalam perebutan mahkota Tiga Mahkota (<i>Triple Crown</i>). Saling mendorong batas kemampuan satu sama lain.", "rel": "", "links": [["Seiun Sky →", "seiunsky.html"], ["King Halo →", "kinghalo.html"]]}], "media": [{"label": "Anime Adaptasi", "badge": "Season 1 Main Protagonist", "text": "Special Week adalah <b>tokoh utama (protagonis)</b> di Anime Uma Musume Season 1, menceritakan perjalanan karirnya dari desa di Hokkaido menuju puncak balap Jepang.", "icon": "fa-solid fa-film"}, {"label": "Manga", "badge": "Haru Urara Ganbaru & Umayon", "text": "Muncul dalam manga spin-off komedi <b>Umayon</b> dan manga <b>Uma Musume: Haru Urara Ganbaru!</b> memperlihatkan keceriaannya sehari-hari.", "icon": "fa-solid fa-book-open"}, {"label": "Lagu Karakter", "badge": "WINNING LIVE", "text": "Menyanyikan lagu solo khas: <span class=\"text-amber-400 italic\">\"Find My Only Way\"</span> serta vokal utama lagu tema <b>Make debut!</b> dan <b>GIRLS' LEGEND U</b>.", "icon": "fa-solid fa-music"}], "mediaTitle": "Penampilan Media", "triviaTitle": "Fakta Menarik (Trivia)", "trivia": [{"q": "1. Kisah Nyata Memiliki Dua Ibu", "a": "Kuda pacu aslinya ditinggal mati oleh induknya lima hari setelah lahir. Ia kemudian dirawat dan dibesarkan oleh pengasuh kuda keturunan Selandia Baru serta pemilik peranakannya, yang diadaptasi menjadi latar kisah \"Dua Ibu\" di serial anime."}, {"q": "2. Nafsu Makan Luar Biasa (Gourmet Spe)", "a": "Special Week terkenal dengan nafsu makannya yang sangat besar. Dalam game dan anime, berat badannya sering naik (<i>fat gain status</i>) jika Trainer memberinya terlalu banyak porsi makanan lezat."}, {"q": "3. Joki Legendaris Yutaka Take", "a": "Special Week memberikan kemenangan Japan Derby pertama bagi joki legendaris Jepang, Yutaka Take, pada tahun 1998, mengukuhkan posisinya dalam sejarah pacuan kuda Jepang."}], "footer": ["Special Week Fan Portal • Uma Musume: Pretty Derby", "Special Week Fan Portal", "Uma Musume: Pretty Derby", "Data dan informasi dirangkum dari Uma Musume Official Wiki. Karakter Special Week merupakan hak cipta dari Cygames, Inc.", "@Finwahyu - Golden Generation Portal"], "theme": {"p": "#ec4899", "s": "#a855f7", "fx": "sakura", "rgb": "244,114,182", "icon": "fa-star"}, "deco": {"st": ["🥕", "🍚", "⭐", "🌸", "🥛", "🌾", "🎀"], "leaf": ["🌸", "🥕", "🍃"], "day": "Pagi cerah di Hokkaido! Sarapan tiga mangkuk dulu, baru latihan. Ganbarimasu!", "night": "Malam di asrama Miho. Perut masih keroncongan, tapi mimpi jadi nomor satu Jepang tetap menyala.", "pat": "radial-gradient(circle,#ec489922 2.5px,transparent 3px) 0 0/18px 18px"}};</script>
