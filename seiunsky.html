ng Style", "Pace Control Boost"], "badge": "Versi 2 dari 4"}, {"id": 3, "title": "Tracen Academy Uniform", "jpTitle": "[Tracen Academy] School Uniform", "type": "School Uniform", "rarity": "Standard Outfit", "img": "https://umamusu.wiki/w/images/d/d2/Game_Asset_chara_stand_1020_000005.png", "description": "Seragam musim panas / musim dingin resmi Akademi Tracen. Desain blazer ungu yang sering dipakai Seiun Sky saat membolos tidur di atap atau tepi danau sekolah.", "tags": ["Campus Life", "Ritto Dormitory", "Student"], "badge": "Versi 3 dari 4"}, {"id": 4, "title": "Casual / Private Outfit", "jpTitle": "[Casual Wear] Private Outfit", "type": "Casual Wear", "rarity": "Event / Private", "img": "https://umamusu.wiki/w/images/2/2a/Game_Asset_chara_stand_1020_901020.png", "description": "Pakaian santai kasual bergaya sweter longgar dan celana nyaman yang dikenakan Seiun Sky saat pergi memancing ikan bersama Trainer di hari libur.", "tags": ["Private Outfit", "Fishing Trip", "Casual"], "badge": "Versi 4 dari 4"}], "specTitle": "Spesifikasi Karakter", "stats": [["Nama Jepang", "セイウンスカイ"], ["Asal Tempat", "Aomori, Jepang"], ["Tinggi / Berat", "155 cm / Tidak ada perubahan"], ["Ukuran B-W-H", "77 - 55 - 80"], ["Kamar Asrama", "Asrama Ritto (Kamar 102)"], ["Teman Kamar", "Nishino Flower"]], "bioTitle": "Biografi Kepribadian", "bio": ["Seiun Sky sering terlihat bolos dari latihan keras untuk memancing di tepi sungai atau sekadar tidur di bawah pohon rindang. Karakter santai ini sering membuat lawan-lawannya meremehkan kekuatannya sebelum garis start dimulai.", "Namun saat pistol balapan dibunyikan, ia berubah menjadi perancang taktik ulung. Dengan keahlian uniknya (<i>Angling x Scheming</i>), ia mampu mengatur kecepatan agar kuda lain kelelahan di tengah balapan sebelum ia melakukan akselerasi tak terkejar di tikungan terakhir."], "aptTitle": "Kemampuan Balap (Aptitude)", "apt": [["Rumput (Turf)", "A"], ["Jarak Menengah", "A"], ["Jarak Jauh", "A"], ["Taktik Front-runner", "A"]]
