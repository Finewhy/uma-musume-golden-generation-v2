<script>window.D={"file": "kinghalo.html", "jpBg": "キングヘイロー", "motto": "「一流の誇り、不屈の王冠！」", "name": "King Halo", "tagline": "Unyielding Pride • Golden Generation", "intro": "King Halo adalah gadis kuda (<b>Uma Musume</b>) dari keluarga terpandang yang dilahirkan sebagai keturunan bangsawan balap. Meskipun sering dipandang remeh dan harus melewati 10 kekalahan beruntun di turnamen G1, ia tidak pernah menyerah hingga akhirnya berhasil merebut mahkota kejuaraannya sendiri di <b>Takamatsunomiya Kinen (2000)</b>!", "quoteSrc": "— Intro Siswa (Student Introduction)", "quote": "Panggil aku KING! Seorang ratu sejati takkan pernah menundukkan kepalanya hanya karena satu kekalahan. Perhatikan keunggulanku, Trainer!", "badges": [["Ulang Tahun", "28 April"], ["Tinggi Badan", "159 cm"], ["VA / Pengisi Suara", "Saeki Iori"], ["Favorit", "Teh Herbal & Keanggunan"]], "heroImg": "https://umamusu.wiki/w/images/8/80/King_Halo_%28Race%29.png", "attire": ["Main Race Attire", "King of Emeralds (Call me KING)", "Grade I"], "outfits": [{"id": 1, "title": "King of Emeralds", "jpTitle": "[キング・オブ・エメラルド] King Halo", "type": "Racing Outfit (Main)", "rarity": "1★ Base / 3★ Ascended", "img": "https://umamusu.wiki/w/images/f/fa/Game_Asset_chara_stand_1061_106101.png", "description": "Seragam balap berornamen bangsawan bernuansa hijau zamrud, ungu, dan emas. Menggambarkan status tinggi kelas bangsawan serta tekad pantang menyerah sang ratu balap.", "tags": ["Turf Specialist", "Short / Mile Distance", "Chaser (Oikomi)"], "badge": "Versi 1 dari 4"}, {"id": 2, "title": "White King Flare (Cheerleader Alt)", "jpTitle": "[白き正義のフレア] King Halo Alt", "type": "Event Outfit (Cheerleader)", "rarity": "3★ Alt Costume", "img": "https://umamusu.wiki/w/images/0/04/Game_Asset_chara_stand_1061_106150.png", "description": "Seragam pemandu sorak bernuansa putih bersih, emas, dan ungu yang mempesona. Menampilkan jiwa kepemimpinan tinggi saat memberi semangat bagi rekan-rekan timnya.", "tags": ["Sports Day Event", "Cheerleader", "Sprint Speed Boost"], "badge": "Versi 2 dari 4"}, {"id": 3, "title": "Tracen Academy Uniform", "jpTitle": "[Tracen Academy] School Uniform", "type": "School Uniform", "rarity": "Standard Outfit", "img": "https://umamusu.wiki/w/images/f/f8/Game_Asset_chara_stand_1061_000005.png", "description": "Seragam musim panas / musim dingin resmi Akademi Tracen. Desain blazer ungu dengan pita dasi emas yang selalu dikenakan King Halo dengan sangat rapi dan anggun.", "tags": ["Campus Life", "Miho Dormitory", "Class Vice-Captain"], "badge": "Versi 3 dari 4"}, {"id": 4, "title": "Casual / Private Outfit", "jpTitle": "[Casual Wear] Private Outfit", "type": "Casual Wear", "rarity": "Event / Private", "img": "https://umamusu.wiki/w/images/5/51/Game_Asset_chara_stand_1061_901061.png", "description": "Pakaian santai kasual bergaya gaun aristokrat modern yang dikenakan King Halo saat menikmati teh sore bersama kawan-kawan akademinya.", "tags": ["Private Outfit", "High Tea Party", "Casual"], "badge": "Versi 4 dari 4"}], "specTitle": "Spesifikasi Karakter", "stats": [["Nama Jepang", "キングヘイロー"], ["Asal Tempat", "Hokkaido, Jepang"], ["Tinggi / Berat", "159 cm / Sempurna"], ["Ukuran B-W-H", "85 - 56 - 82"], ["Kamar Asrama", "Asrama Miho (Kamar 305)"], ["Teman Kamar", "Kawakami Princess"]], "bioTitle": "Biografi Kepribadian", "bio": ["King Halo dibesarkan di bawah bayang-bayang ibunya yang merupakan kuda pemenang balapan elit kelas dunia. Ekspektasi tinggi tersebut membuatnya membentuk kepribadian berharga diri tinggi, tegas, dan menuntut kesempurnaan pada dirinya sendiri.", "Meskipun sempat menanggung kekalahan berulang kali di balapan jarak jauh dan menengah saat melawan Special Week dan Seiun Sky, King Halo membuktikan jiwa juangnya yang luar biasa dengan berpindah ke nomor sprint cepat hingga memenangkan trofi mahkota G1 di Takamatsunomiya Kinen."], "aptTitle": "Kemampuan Balap (Aptitude)", "apt": [["Rumput (Turf)", "A"], ["Jarak Pendek (Short)", "A"], ["Jarak Mile", "A"], ["Taktik Chaser (追込)", "A"]], "appTitle": "Ciri Visual & Desain Karakter", "features": [{"t": "Rambut Pirang Cokelat Keriting Anggun", "d": "Rambut panjang keriting bertata gaya aristokrat tinggi yang mencerminkan status kebangsawanannya.", "i": "fa-solid fa-crown"}, {"t": "Mahkota & Perhiasan Emas", "d": "Aksesoris bros emas bermata zamrud hijau yang dikenakan di bagian kerah dasi seragamnya.", "i": "fa-solid fa-gem"}, {"t": "Pose Tangan di Pinggang (Ohoho Pose)", "d": "Pose khas tawa bangsawan dengan satu tangan berkacak pinggang dan kepala mendongak bangga.", "i": "fa-solid fa-person-rays"}, {"t": "Mangkuk Teh Inggris Klasik", "d": "Sering digambarkan menikmati cangkir teh porselen impor saat beristirahat di klub sekolah.", "i": "fa-solid fa-wine-glass"}], "irlTitle": "Sejarah Kuda Pacu Asli (King Halo 1995-2019)", "irl": "King Halo (lahir 28 April 1995 di Hokkaido, Jepang) adalah putra dari induk pemenang balap Amerika Serikat, Goodbye Halo. Meskipun sering finis di posisi 2 hingga 5 pada balapan klasik melawan Special Week, Grass Wonder, dan Seiun Sky, King Halo merebut gelar kejuaraan <b>Takamatsunomiya Kinen (2000)</b> dengan loncatan sprint spektakuler di usia 5 tahun!", "irlStats": [["Total Rekor Balap", "27 Laga / 6 Kemenangan"], ["Prestasi Spesial", "Kemenangan Sprint G1"], ["Keturunan Sukses", "Ayah dari Kawakami Princess"]], "tabs": ["Biografi & Statistik", "Penampilan & Desain", "Kuda Pacu Nyata (IRL)"], "varTitle": "Galeri Variasi Karakter (4 Versi)", "varSub": "Gunakan tombol navigasi untuk melihat 4 iterasi kostum King Halo yang tersedia dalam waralaba.", "wikiTitle": "Profil & Detail Wiki", "relTitle": "Hubungan Karakter (Relationships)", "rels": [{"label": "Junior / Roommate", "name": "Kawakami Princess", "desc": "Junior yang sangat mengagumi King Halo sebagai \"Ratu Sejati\". King Halo selalu berusaha menjadi teladan terbaik bagi Kawakami.", "rel": "Hubungan: Mentorship & Roommate", "links": []}, {"label": "Rival Klasik", "name": "Special Week", "desc": "Rival di Tokyo Yushun (Japan Derby) 1998. King Halo menganggap persaingannya dengan Special Week sebagai motivasi terbesarnya.", "rel": "Hubungan: Rivalry Seangkatan", "links": [["Spe Page →", "specialweek.html"]]}, {"label": "Sahabat Debat", "name": "Seiun Sky", "desc": "Meskipun sering mengomeli gaya santai Seiun Sky, keduanya sangat dekat dan saling mengerti perjuangan di lapangan balap.", "rel": "Hubungan: Generasi Emas", "links": [["Seiun Page →", "seiunsky.html"]]}, {"label": "Rekan Angkatan", "name": "Grass & El Condor", "desc": "Anggota Generasi Emas 1998 yang saling mendorong batas kemampuan satu sama lain di arena pacuan.", "rel": "", "links": [["Grass Page →", "grasswonder.html"], ["El Condor →", "elcondorpasa.html"]]}], "media": [{"label": "Anime Adaptasi", "badge": "Season 1 Key Character", "text": "Di Anime <b>Season 1</b>, momen kebangkitan King Halo di Takamatsunomiya Kinen digambarkan sebagai salah satu klimaks emosional terbaik.", "icon": "fa-solid fa-film"}, {"label": "Manga", "badge": "Umayon & Spin-off", "text": "Sering tampil lucu dalam manga spin-off <b>Umayon</b> saat mempertahankan etiket kebangsawanannya di depan teman-temannya.", "icon": "fa-solid fa-book-open"}, {"label": "Lagu Karakter", "badge": "WINNING LIVE", "text": "Menyanyikan lagu solo khas bersuasana kemegahan: <span class=\"text-amber-400 italic\">\"CATCH THE CLUSTER\"</span> serta vokal utama lagu tema <b>Make debut!</b> dan <b>GIRLS' LEGEND U</b>.", "icon": "fa-solid fa-music"}], "mediaTitle": "Penampilan Media", "triviaTitle": "Fakta Menarik (Trivia)", "trivia": [{"q": "1. Latar Belakang Garis Keturunan Elit", "a": "Kuda pacu aslinya merupakan anak dari jantan legendaris Dancing Brave dan induk Goodbye Halo (pemenang 7 balapan G1 di Amerika Serikat), menjadikannya keturunan bangsawan murni di dunia balap."}, {"q": "2. Gelar Juara Setelah 10 Kekalahan G1", "a": "Meskipun sempat kalah dalam 10 percobaannya di balapan G1, King Halo terus berjuang di berbagai jarak hingga akhirnya memenangkan Takamatsunomiya Kinen di percobaan ke-11 nya!"}, {"q": "3. Julukan \"Kudanya Para Penggemar\"", "a": "Semangat pantang menyerahnya membuat King Halo menjadi salah satu kuda paling dicintai oleh masyarakat Jepang, membuktikan bahwa kehormatan sejati didapat dari perjuangan tanpa henti."}], "footer": ["King Halo Fan Portal • Uma Musume: Pretty Derby", "King Halo Fan Portal", "Uma Musume: Pretty Derby", "Data dan informasi dirangkum dari Uma Musume Official Wiki. Karakter King Halo merupakan hak cipta dari Cygames, Inc.", "@Finwahyu - Golden Generation Portal"], "theme": {"p": "#8b5cf6", "s": "#f59e0b", "fx": "sparkle", "rgb": "196,181,253", "icon": "fa-crown"}, "deco": {"st": ["👑", "✨", "🌹", "💎", "🫖", "🎀", "💜"], "leaf": ["✨", "🌹", "💜"], "day": "Selamat siang, rakyatku. Teh sore sudah disajikan. Sang KING hari ini pun tampil sempurna!", "night": "Malam yang megah. Mahkota berkilau di bawah cahaya bulan. Jangan lihat air mata di balik topeng angkuh itu.", "pat": "radial-gradient(circle,#f59e0b33 3px,transparent 4px) 0 0/26px 26px"}};</script>
