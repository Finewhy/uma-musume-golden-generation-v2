<script>window.D={"file": "grasswonder.html", "jpBg": "グラスワンダー", "motto": "「鳳凰の如く、静かに燃える」", "name": "Grass Wonder", "tagline": "Yamato Nadeshiko • Golden Generation", "intro": "Grass Wonder adalah gadis kuda (<b>Uma Musume</b>) yang lahir di Amerika namun dibesarkan dengan tata krama tradisi Jepang yang sangat kental. Dikenal dengan kepribadiannya yang sangat sopan, lemah lembut, dan selalu bertutur kata halus layaknya seorang <b>Yamato Nadeshiko</b>, di balik ketenangannya tersembunyi jiwa kompetitif yang membara bagai api dingin.", "quoteSrc": "— Intro Siswa (Student Introduction)", "quote": "Saya akan berlari dengan penuh kehormatan dan komitmen. Mohon dukungannya, Trainer-san.", "badges": [["Ulang Tahun", "18 Februari"], ["Tinggi Badan", "152 cm"], ["VA / Pengisi Suara", "Maeda Rena"], ["Favorit", "Kue Manis Tradisional"]], "heroImg": "https://umamusu.wiki/w/images/2/24/Grass_Wonder_%28Proto%29.png", "attire": ["Main Race Attire", "Stone-Piercing Blue (岩穿つ青)", "Grade I"], "outfits": [{"id": 1, "title": "Stone-Piercing Blue", "jpTitle": "[岩穿つ青] Grass Wonder", "type": "Racing Outfit (Main)", "rarity": "3★ Base Character", "img": "https://umamusu.wiki/w/images/0/0a/Game_Asset_chara_stand_1011_101101.png", "description": "Seragam balap ikonik bernuansa biru royal dan putih dengan aksen pita merah. Menampilkan keanggunan pelaut tradisional yang siap berlari kencang di lapangan rumput.", "tags": ["Turf Specialist", "Medium/Long Distance", "Betweener / Pace Chaser"], "badge": "Versi 1 dari 4"}, {"id": 2, "title": "Saintly Jade (Heian Monk/Shrine Maiden)", "jpTitle": "[聖鉄・鎧衣] Grass Wonder Alt", "type": "Event Outfit (New Year / Traditional)", "rarity": "3★ Alt Costume", "img": "https://umamusu.wiki/w/images/3/36/Game_Asset_chara_stand_1011_101116.png", "description": "Pakaian berornamen tradisional dengan dominasi warna hijau zamrud, putih, dan jubah pertempuran gaya Jepang kuno. Memperkuat aura prajurit naginata yang tangguh.", "tags": ["New Year Event", "Heian Style", "Debuff Resistance"], "badge": "Versi 2 dari 4"}, {"id": 3, "title": "Tracen Academy Uniform", "jpTitle": "[Tracen Academy] School Uniform", "type": "School Uniform", "rarity": "Standard Outfit", "img": "https://umamusu.wiki/w/images/5/54/Game_Asset_chara_stand_1011_000005.png", "description": "Seragam musim panas / musim dingin resmi Akademi Tracen. Desain blazer ungu dengan dasi kupu-kupu yang dipakai sehari-hari di kelas dan asrama.", "tags": ["Campus Life", "Miho Dormitory", "Student Council"], "badge": "Versi 3 dari 4"}, {"id": 4, "title": "Party Dash / Casual Attire", "jpTitle": "[Casual Wear] Private Outfit", "type": "Casual Wear", "rarity": "Party Dash / Event", "img": "https://umamusu.wiki/w/images/0/0f/Game_Asset_chara_stand_1011_901011.png", "description": "Pakaian santai kasual bergaya feminin lembut yang dikenakan Grass saat jalan-jalan bersama teman-teman Golden Generation di luar jam sekolah.", "tags": ["Private Outfit", "Wagashi Shopping", "Casual"], "badge": "Versi 4 dari 4"}], "specTitle": "Spesifikasi Karakter", "stats": [["Nama Jepang", "グラスワンダー"], ["Asal Tempat", "Amerika Serikat (Import)"], ["Tinggi / Berat", "152 cm / Tidak ada perubahan"], ["Ukuran B-W-H", "77 - 53 - 84"], ["Kamar Asrama", "Asrama Miho (Kamar 208)"], ["Teman Kamar", "El Condor Pasa"]], "bioTitle": "Biografi Kepribadian", "bio": ["Meskipun lahir di Amerika Serikat, Grass Wonder dibesarkan dengan nilai-nilai tradisional Jepang yang kental. Ia menyukai budaya teh, pembuatan kue manis tradisional (<b>wagashi</b>), dan kaligrafi. tutur bahasanya selalu tenang, ramah, serta menggunakan bentuk kehormatan (<b>desu/masu</b>).", "Namun di balik sifatnya yang tampak lembut bak perawan Jepang (<b>Yamato Nadeshiko</b>), ia memiliki naluri bertarung dan tekad kompetitif yang luar biasa tinggi di arena balap. Keberaniannya menghadapi cedera berat dan kebangkitannya menuju kemenangan menjadikannya salah satu sosok paling dihormati di generasinya."], "aptTitle": "Kemampuan Balap (Aptitude)", "apt": [["Rumput (Turf)", "A"], ["Jarak Menengah", "A"], ["Jarak Jauh", "A"], ["Taktik Pengejar", "A"]], "appTitle": "Ciri Visual & Desain Karakter", "features": [{"t": "Rambut & Mata", "d": "Rambut cokelat pirang lurus bergelombang lembut yang panjang, dipadukan dengan mata berwarna biru laut jernih.", "i": "fa-solid fa-eye"}, {"t": "Aksesoris Telinga Kanan", "d": "Pita bergaris biru, putih, dan merah di telinga kanan yang menandakan latar belakang ras kuda jantan di dunia nyata.", "i": "fa-solid fa-ribbon"}, {"t": "Detail Seragam Pelaut", "d": "Memadukan elemen blazer sekolah gaya Barat dengan lipatan rok khas pakaian tradisional Jepang (<b>hakama-inspired</b>).", "i": "fa-solid fa-vest"}, {"t": "Sepatu Asimetris", "d": "Menggunakan sepatu balap warna putih dan hitam/cokelat di masing-masing kaki sebagai simbol sejarah cedera dan penyembuhannya.", "i": "fa-solid fa-shoe-prints"}], "irlTitle": "Sejarah Kuda Pacu Asli (Grass Wonder 1995-2024)", "irl": "Grass Wonder (lahir 18 Februari 1995 di Kentucky, AS) adalah kuda pacu jantan murni (<b>thoroughbred</b>) yang bertanding di Jepang. Ia terkenal karena menjuarai turnamen bergengsi <b>Takarazuka Kinen (1999)</b> dan <b>Arima Kinen (1998, 1999)</b> secara berturut-turut.", "irlStats": [["Total Rekor Balap", "15 Laga / 9 Kemenangan"], ["Rival Utama", "Special Week"], ["Gelar Utama", "Grand Prix Horse"]], "tabs": ["Biografi & Statistik", "Penampilan & Desain", "Kuda Pacu Nyata (IRL)"], "varTitle": "Galeri Variasi Karakter (4 Versi)", "varSub": "Gunakan tombol navigasi untuk melihat 4 iterasi kostum Grass Wonder yang tersedia dalam waralaba.", "wikiTitle": "Profil & Detail Wiki", "relTitle": "Hubungan Karakter (Relationships)", "rels": [{"label": "Rival Utama", "name": "Special Week", "desc": "Rival terbesar dan sahabat dekat. Pertarungan sengit mereka di Takarazuka Kinen dan Arima Kinen 1999 menjadi salah satu momen paling legendaris dalam sejarah balap.", "rel": "Hubungan: Dualitas Persaingan", "links": [["Spe Page →", "specialweek.html"]]}, {"label": "Teman Kamar", "name": "El Condor Pasa", "desc": "Rekan satu kamar di Asrama Miho. Meskipun memiliki kepribadian yang sangat bertolak belakang (El ceria &amp; hiperaktif), keduanya sangat saling mendukung.", "rel": "Hubungan: Roommate & Friends", "links": [["El Condor Page →", "elcondorpasa.html"]]}, {"label": "Sahabat Angkatan", "name": "Seiun Sky", "desc": "Teman seangkatan Golden Generation. Grass sering kali menjadi sosok yang mengawasi taktik santai namun cerdik dari Seiun Sky.", "rel": "Hubungan: Generasi Emas", "links": [["Seiun Page →", "seiunsky.html"]]}, {"label": "Rekan Seperjuangan", "name": "King Halo", "desc": "Anggota lain dari Golden Generation yang dihormati Grass karena harga diri tinggi serta tekad pantang menyerah yang dimilikinya.", "rel": "Hubungan: Generasi Emas", "links": [["King Page →", "kinghalo.html"]]}], "media": [{"label": "Anime Adaptasi", "badge": "Season 1 Main Rival", "text": "Grass Wonder berperan sangat penting di Anime <b>Season 1</b>, di mana kisahnya saat mengalami cedera dan kembali bertanding melawan Special Week digambarkan secara emosional.", "icon": "fa-solid fa-film"}, {"label": "Manga", "badge": "Cameo & Spin-off", "text": "Muncul dalam manga <b>Uma Musume: Haru Urara Ganbaru!</b> dan spin-off <b>Umayon</b>, memperlihatkan sisi komedinya bersama El Condor Pasa.", "icon": "fa-solid fa-book-open"}, {"label": "Lagu Karakter", "badge": "WINNING LIVE", "text": "Menyanyikan lagu solo khas bernuansa tradisional Jepang: <span class=\"text-amber-400 italic\">\"Secret GRADUATION\"</span> serta lagu tema utama <b>Make debut!</b> dan <b>GIRLS' LEGEND U</b>.", "icon": "fa-solid fa-music"}], "mediaTitle": "Penampilan Media", "triviaTitle": "Fakta Menarik (Trivia)", "trivia": [{"q": "1. Keahlian Naginata (Bela Diri Tradisional)", "a": "Grass Wonder mahir menggunakan senjata tradisional Jepang <b>Naginata</b>. Dalam versi kostum Alt (<b>Saintly Jade</b>), aura prajurit kuilnya terinspirasi dari keahlian bela diri ini."}, {"q": "2. Hobi Membuat Wagashi (Kue Tradisional)", "a": "Grass Wonder sering membuat kue manis ala Jepang untuk teman-teman akademinya. Sifat telatennya saat memasak mencerminkan ketelitian bertandingnya."}, {"q": "3. Julukan \"Phoenix\" Kuda Pacu", "a": "Kuda pacu aslinya sempat mengalami cedera parah pada patah tulang kaki kanan bawahnya. Namun ia berhasil bangkit dan mendominasi Arima Kinen, membuktikannya layak dijuluki sebagai burung Phoenix yang bangkit dari abu."}], "footer": ["Grass Wonder Fan Portal • Uma Musume: Pretty Derby", "Grass Wonder Fan Portal", "Uma Musume: Pretty Derby", "Data dan informasi dirangkum dari Uma Musume Official Wiki. Karakter Grass Wonder merupakan hak cipta dari Cygames, Inc.", "@Finwahyu - Golden Generation Portal"], "theme": {"p": "#3b82f6", "s": "#ef4444", "fx": "petal", "rgb": "255,182,193", "icon": "fa-dove"}, "deco": {"st": ["🕊️", "🌸", "🍵", "🎴", "🏯", "🔥", "🎐"], "leaf": ["🌸", "🍁", "🍃"], "day": "Siang yang tenang. Teh hijau, kimono, dan senyum sopan. Tapi jangan remehkan api yang tersimpan.", "night": "Malam berangin di bawah bulan. Api dingin sang Phoenix menyala paling terang saat sunyi.", "pat": "radial-gradient(circle at 100% 150%,transparent 24%,#3b82f625 25% 28%,transparent 29%) 0 0/26px 16px"}};</script>
